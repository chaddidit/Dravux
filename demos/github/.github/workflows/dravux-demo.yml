name: Dravux demo audit

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  accessibility-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Run Dravux contract tests
        run: python3 -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: Audit the live synthetic page
        run: >-
          python3 -B scripts/audit_demo_html.py
          demos/github/live/index.html
          --state pull-request
          --output "${{ runner.temp }}/dravux-report.json"
          --fail-on-findings
      - name: Validate the report contract
        if: always()
        run: python3 -B scripts/validate_report.py "${{ runner.temp }}/dravux-report.json"

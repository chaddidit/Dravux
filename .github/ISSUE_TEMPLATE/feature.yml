name: Feature or portability request
description: A capability, host adapter, or platform path you want next
title: "Feature: "
labels: ["enhancement"]
body:
  - type: textarea
    id: ask
    attributes:
      label: What do you want
    validations:
      required: true
  - type: textarea
    id: honesty
    attributes:
      label: Honesty check
      description: What evidence would this need? What must Dravux still refuse to claim?
    validations:
      required: true
  - type: dropdown
    id: layer
    attributes:
      label: Layer
      options:
        - Contracts / validators
        - Installer / packaging
        - Host adapter (Claude, Codex, ChatGPT, Copilot)
        - Windows / portability
        - Docs / website
        - Other
    validations:
      required: true

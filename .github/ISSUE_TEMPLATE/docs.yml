name: Docs clarification
description: Front language, install guide, or capability matrix is hard to use
title: "Docs: "
labels: ["documentation"]
body:
  - type: textarea
    id: where
    attributes:
      label: Where
      description: File or page (for example START_HERE.md, INSTALLERS/..., SECURITY.md).
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is unclear
      description: Quote the confusing bit if you can. Say whether you are a non-technical user or a terminal user.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested clearer wording (optional)

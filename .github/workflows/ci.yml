name: Dravux offline verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.8"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
          # Windows exercises the OS-agnostic Python core without requiring a local Windows machine.
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Export clean release tree
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/dravux-release"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/dravux-release"

      - name: Verify release structure
        shell: bash
        working-directory: ${{ runner.temp }}/dravux-release
        run: sh verify-release.sh
